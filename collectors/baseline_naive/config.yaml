# Several collector configs can run in one process (see scripts/run_collector.sh): their pipelines
# merge, so one workload feeds all of them and every method sees the same traces.
# baseline_naive: keeps every span. It is the reference capture other collectors are scored against.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  file/baseline_naive:
    path: /out/baseline_naive.jsonl

service:
  pipelines:
    traces/baseline_naive:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/baseline_naive]
