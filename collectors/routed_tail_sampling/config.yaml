# routed_tail_sampling: tail sampling with a hold time per job. Spans are routed by the
# app's mock_io.run_job attribute to a tail sampler whose decision_wait fits that
# job's longest run; spans without it go to the default. Keeps errors, runs slower than
# their job's threshold, and 1% of traces. GENERATED by
# scripts/calibrate_thresholds.py from captures/supermarket_seed42/baseline_naive.jsonl; rerun it instead of editing.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
connectors:
  routing/routed_tail_sampling:
    default_pipelines:
    - traces/routed_tail_sampling_120s
    table:
    - condition: span.attributes["mock_io.run_job"] == "supermarket__load_category_manager_pack" or span.attributes["mock_io.run_job"] == "supermarket__load_delivery_planning_board" or span.attributes["mock_io.run_job"] == "supermarket__load_finance_margin_report" or span.attributes["mock_io.run_job"] == "supermarket__load_markdown_recommendations" or span.attributes["mock_io.run_job"] == "supermarket__load_replenishment_forecast" or span.attributes["mock_io.run_job"] == "supermarket__load_shrinkage_report" or span.attributes["mock_io.run_job"] == "supermarket__transform_ecommerce_funnel" or span.attributes["mock_io.run_job"] == "supermarket__transform_margin_by_sku" or span.attributes["mock_io.run_job"] == "supermarket__transform_promo_uplift" or span.attributes["mock_io.run_job"] == "supermarket__transform_store_cluster_profiles"
      pipelines:
      - traces/routed_tail_sampling_45s
    - condition: span.attributes["mock_io.run_job"] == "supermarket__load_ecommerce_merch_feed" or span.attributes["mock_io.run_job"] == "supermarket__load_full_year_data_warehouse_load" or span.attributes["mock_io.run_job"] == "supermarket__load_labor_scheduling_input" or span.attributes["mock_io.run_job"] == "supermarket__load_regional_ops_summary" or span.attributes["mock_io.run_job"] == "supermarket__load_stock_alert_feed" or span.attributes["mock_io.run_job"] == "supermarket__load_store_dashboards"
      pipelines:
      - traces/routed_tail_sampling_60s
    - condition: span.attributes["mock_io.run_job"] == "supermarket__load_customer_churn_mart" or span.attributes["mock_io.run_job"] == "supermarket__load_executive_scorecard" or span.attributes["mock_io.run_job"] == "supermarket__load_historical_backfill_load" or span.attributes["mock_io.run_job"] == "supermarket__load_loyalty_crm_sync" or span.attributes["mock_io.run_job"] == "supermarket__load_price_change_queue" or span.attributes["mock_io.run_job"] == "supermarket__load_promo_performance_board" or span.attributes["mock_io.run_job"] == "supermarket__load_returns_analysis_mart" or span.attributes["mock_io.run_job"] == "supermarket__load_store_manager_digest" or span.attributes["mock_io.run_job"] == "supermarket__load_supplier_portal" or span.attributes["mock_io.run_job"] == "supermarket__load_weather_sales_report"
      pipelines:
      - traces/routed_tail_sampling_90s
