description: "Small dev scenario: two jobs, a handful of calls."

defaults:
  seed: 1
  latency: {dist: lognormal, median_ms: 1000, sigma: 0.4}
  failure_rate: 0.0

jobs:
  - name: ingest_orders
    ops:
      - name: fetch_orders
        call_groups:
          - {io: http, action: get, count: 25, mode: gather, max_concurrency: 3}
      - name: store_orders
        call_groups:
          - {io: db, action: insert, count: 5}
          - {io: gcs, action: upload, count: 1, payload_bytes: 2048}

  - name: daily_report
    depends_on: [ingest_orders]
    ops:
      - name: read
        call_groups:
          - {io: db, action: query, count: 2}
      - name: publish
        call_groups:
          - {io: http, action: post, count: 1}
