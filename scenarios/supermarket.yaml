description: 'Supermarket chain data platform: 10 importers, 15+2 transformers, 20+2 loaders with mixed dependencies and first/third-party
  service calls. Generated by scripts/generate_supermarket.py.'
service_name: supermarket-dag
defaults:
  seed: 42
  latency:
    dist: lognormal
    median_ms: 30
    sigma: 0.6
  failure_rate: 0.0
services:
  price_engine:
    kind: first_party
    call_groups:
    - io: db
      action: query
      count: 1
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
    - io: db
      action: query
      count: 3
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
    - io: gcs
      action: download
      count: 1
      payload_bytes: 65536
      latency:
        dist: lognormal
        median_ms: 50
        sigma: 0.4
  product_catalog:
    kind: first_party
    call_groups:
    - io: db
      action: query
      count: 4
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
    - io: db
      action: query
      count: 4
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
    - io: http
      action: get
      count: 5
      mode: gather
      max_concurrency: 3
      latency:
        dist: normal
        mean_ms: 90
        stddev_ms: 25
      failure_rate: 0.01
  inventory_api:
    kind: first_party
    call_groups:
    - io: db
      action: query
      count: 1
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
    - io: service
      service: product_catalog
      action: call
      count: 1
      latency:
        dist: lognormal
        median_ms: 6
        sigma: 0.4
    - io: db
      action: insert
      count: 8
      mode: gather
      max_concurrency: 4
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
  demand_forecaster:
    kind: first_party
    call_groups:
    - io: gcs
      action: download
      count: 4
      mode: gather
      payload_bytes: 1048576
      latency:
        dist: lognormal
        median_ms: 50
        sigma: 0.4
    - io: db
      action: query
      count: 4
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
    - io: service
      service: weather_api
      action: call
      count: 3
      mode: gather
      max_concurrency: 3
      latency:
        dist: normal
        mean_ms: 120
        stddev_ms: 40
      failure_rate: 0.01
  loyalty_service:
    kind: first_party
    call_groups:
    - io: db
      action: query
      count: 3
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
    - io: db
      action: insert
      count: 16
      mode: gather
      max_concurrency: 4
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
  notification_hub:
    kind: first_party
    call_groups:
    - io: db
      action: insert
      count: 1
      latency:
        dist: lognormal
        median_ms: 8
        sigma: 0.5
    - io: service
      service: email_provider
      action: call
      count: 3
      mode: gather
      max_concurrency: 3
      latency:
        dist: normal
        mean_ms: 120
        stddev_ms: 40
      failure_rate: 0.01
  weather_api:
    kind: third_party
  address_geocoder:
    kind: third_party
  fx_rate_provider:
    kind: third_party
  tax_service:
    kind: third_party
  email_provider:
    kind: third_party
  slack_webhook:
